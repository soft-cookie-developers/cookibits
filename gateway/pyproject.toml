[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cookibits-gateway"
version = "0.1.0"
description = "Authenticating proxy in front of a local vLLM server"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "starlette==1.10.0",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cookibits-gateway = "cookibits_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
